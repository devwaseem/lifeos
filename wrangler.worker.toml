name = "lifeos-local-api"
main = "src/worker/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["global_fetch_strictly_public"]

[vars]
LOCAL_SYNC_TOKEN = "lifeos-local-dev"
MCP_LOCAL_TOKEN = "lifeos-mcp-local-dev"
MCP_RESOURCE_URL = "http://localhost:8787/mcp"
MCP_ALLOWED_HOSTS = "localhost,127.0.0.1"
MCP_ALLOWED_ORIGINS = "http://localhost:5173"

[[d1_databases]]
binding = "DB"
database_name = "lifeos"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "2f7c6a77824942d78133a39142891272"
