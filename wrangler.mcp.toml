name = "lifeos-mcp"
main = "src/worker/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = true

routes = [
  { pattern = "life.w9m.app/mcp*", zone_name = "w9m.app" },
]

[vars]
MCP_RESOURCE_URL = "https://life.w9m.app/mcp"
MCP_ALLOWED_HOSTS = "life.w9m.app"

[[d1_databases]]
binding = "DB"
database_name = "lifeos"
database_id = "19d073bb-dc53-4017-8086-f90f8975a7cf"
migrations_dir = "migrations"


[observability]
enabled = true
